function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Install Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Install cache berhasil ✔";setTimeout(function(){window.msgs.innerHTML="Tutup dan buka kembali halaman ini";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Install Cache! - Bersihkan dan coba kembali";};
</script>
